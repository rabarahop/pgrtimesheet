<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="flex flex-1 items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">Timesheet Login</h2>
            
            <div id="error-message" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>
            <div id="success-message" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4 text-sm"></div>

            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">
                    Ingresar
                </button>
            </form>
            <div class="mt-4 text-center">
                <button id="forgot-password" class="text-sm text-blue-500 hover:underline">¿Olvidaste tu contraseña?</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL DEL SISTEMA (Oculta al inicio) -->
    <div id="app-screen" class="hidden flex-col h-screen">
        <!-- Barra de Navegación -->
        <nav class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-md">
            <div class="font-bold text-xl">Timesheet Portal</div>
            <div class="flex items-center gap-4">
                <div class="text-sm">
                    Hola, <span id="user-display-email" class="font-bold"></span> 
                    <span id="user-display-role" class="bg-blue-600 px-2 py-1 rounded text-xs ml-2 uppercase"></span>
                </div>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold">Salir</button>
            </div>
        </nav>

        <!-- Contenido dinámico según el rol -->
        <div class="p-8">
            <div id="employee-view" class="hidden bg-white p-6 rounded shadow-md border-l-4 border-blue-500">
                <h3 class="text-xl font-bold mb-2">Panel de Empleado</h3>
                <p>Aquí irá el formulario para ingresar las horas de trabajo y gastos.</p>
            </div>

            <div id="admin-view" class="hidden mt-6 bg-white p-6 rounded shadow-md border-l-4 border-purple-500">
                <h3 class="text-xl font-bold mb-2">Panel de Administración / Base de Datos</h3>
                <p>Aquí irá la tabla general de todos los empleados y el módulo para crear nuevos usuarios.</p>
            </div>
        </div>
    </div>

    <!-- SCRIPTS DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

        // Llaves extraídas de tu consola de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDNh-uSWilG0WiU7lEFlrbLblqVY3trY3PE",
            authDomain: "prgtimesheet.firebaseapp.com",
            projectId: "prgtimesheet",
            storageBucket: "prgtimesheet.firebasestorage.app",
            messagingSenderId: "1002205034432",
            appId: "1:1002205034432:web:0cbd4568c2b220a9807a25",
            measurementId: "G-9H4L8H4X4X"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elementos de la interfaz
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const btnLogout = document.getElementById('logout-btn');
        const btnForgot = document.getElementById('forgot-password');

        // Vistas de roles
        const employeeView = document.getElementById('employee-view');
        const adminView = document.getElementById('admin-view');

        // Detectar si el usuario está conectado o desconectado
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Usuario ingresó exitosamente
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                appScreen.classList.add('flex');
                
                document.getElementById('user-display-email').innerText = user.email;

                // Buscar el rol en Firestore
                const docRef = doc(db, "usuarios", user.email);
                const docSnap = await getDoc(docRef);
                
                let userRole = "empleado"; // Rol por defecto
                if (docSnap.exists()) {
                    userRole = docSnap.data().rol;
                }

                document.getElementById('user-display-role').innerText = userRole;

                // Mostrar pantallas según el rol
                if (userRole === 'propietario' || userRole === 'contralor') {
                    adminView.classList.remove('hidden');
                    employeeView.classList.remove('hidden'); // Los jefes ven todo
                } else {
                    employeeView.classList.remove('hidden'); // El empleado solo ve su panel
                }
            } else {
                // Usuario desconectado
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                appScreen.classList.remove('flex');
                adminView.classList.add('hidden');
                employeeView.classList.add('hidden');
            }
        });

        // Iniciar Sesión
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    errorMsg.innerText = "Error: Correo o contraseña incorrectos.";
                    errorMsg.classList.remove('hidden');
                });
        });

        // Cerrar Sesión
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // Olvidé mi contraseña
        btnForgot.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if(!email) {
                errorMsg.innerText = "Por favor, escribe tu correo arriba primero y luego presiona este botón.";
                errorMsg.classList.remove('hidden');
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    successMsg.innerText = "¡Enlace de recuperación enviado! Revisa tu correo.";
                    successMsg.classList.remove('hidden');
                })
                .catch((error) => {
                    errorMsg.innerText = "Error al enviar el correo. Verifica que esté bien escrito.";
                    errorMsg.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
