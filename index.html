<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="flex flex-1 items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">Timesheet Login</h2>
            
            <div id="error-message" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>
            <div id="success-message" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4 text-sm"></div>

            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">
                    Ingresar
                </button>
            </form>
            <div class="mt-4 text-center">
                <button id="forgot-password" class="text-sm text-blue-500 hover:underline">¿Olvidaste tu contraseña?</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL DEL SISTEMA (Oculta al inicio) -->
    <div id="app-screen" class="hidden flex-col h-screen overflow-y-auto">
        <!-- Barra de Navegación -->
        <nav class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-md shrink-0">
            <div class="font-bold text-xl">Timesheet Portal</div>
            <div class="flex items-center gap-4">
                <div class="text-sm hidden sm:block">
                    Hola, <span id="user-display-email" class="font-bold"></span> 
                    <span id="user-display-role" class="bg-blue-600 px-2 py-1 rounded text-xs ml-2 uppercase"></span>
                </div>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm font-bold">Salir</button>
            </div>
        </nav>

        <!-- Contenido dinámico según el rol -->
        <div class="p-4 md:p-8 flex-1 max-w-6xl mx-auto w-full">
            
            <!-- PANEL DE EMPLEADO (Formulario) -->
            <div id="employee-view" class="hidden bg-white p-6 rounded shadow-md border-t-4 border-blue-500 mb-6">
                <h3 class="text-xl font-bold mb-4 text-gray-800">Registrar Horas de Trabajo</h3>
                
                <div id="ts-success-msg" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4 text-sm font-bold">
                    ¡Reporte enviado exitosamente!
                </div>

                <form id="timesheet-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Fecha -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Fecha</label>
                            <input type="date" id="ts-date" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                        </div>
                        <!-- Proyecto -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Proyecto / Job Name</label>
                            <input type="text" id="ts-project" placeholder="Ej. Citizens Bala" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Horas Regulares -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Horas Regulares</label>
                            <input type="number" step="0.5" id="ts-reg-hours" placeholder="0" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" required>
                        </div>
                        <!-- Horas Extras -->
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-1">Horas Extras</label>
                            <input type="number" step="0.5" id="ts-ext-hours" placeholder="0" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <!-- Notas / Gastos -->
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">Gastos y Notas (Opcional)</label>
                        <textarea id="ts-notes" rows="3" placeholder="Describe materiales comprados, peajes, o notas del día..." class="w-full p-2 border rounded focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <!-- Botón Enviar -->
                    <div class="pt-2">
                        <button type="submit" class="w-full md:w-auto bg-green-600 text-white font-bold py-2 px-6 rounded hover:bg-green-700 shadow-sm transition-colors">
                            Enviar Reporte Diario
                        </button>
                    </div>
                </form>
            </div>

            <!-- PANEL DE ADMINISTRACIÓN (Base de Datos) -->
            <div id="admin-view" class="hidden bg-white p-6 rounded shadow-md border-t-4 border-purple-500">
                <h3 class="text-xl font-bold mb-2 text-gray-800">Panel de Administración</h3>
                <p class="text-gray-600">Aquí irá la tabla general de todos los empleados y el módulo para crear nuevos usuarios.</p>
            </div>
        </div>
    </div>

    <!-- SCRIPTS DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-auth.js";
        // AÑADIMOS addDoc, collection y serverTimestamp a la importación
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore.js";

        // Tus llaves de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDnh-uSVwIiG0kU7IeELr0blqY3tHY33PE",
            authDomain: "prgtimesheet.firebaseapp.com",
            projectId: "prgtimesheet",
            storageBucket: "prgtimesheet.firebasestorage.app",
            messagingSenderId: "1002205034432",
            appId: "1:1002205034432:web:0cbd4568c2b220e9087a25",
            measurementId: "G-9H4L8W4X4X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elementos UI Generales
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const errorMsg = document.getElementById('error-message');
        const employeeView = document.getElementById('employee-view');
        const adminView = document.getElementById('admin-view');

        // Elementos Formulario Timesheet
        const tsForm = document.getElementById('timesheet-form');
        const tsSuccessMsg = document.getElementById('ts-success-msg');
        
        // Poner la fecha de hoy por defecto en el formulario
        document.getElementById('ts-date').valueAsDate = new Date();

        // Control de Sesión
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                appScreen.classList.add('flex');
                
                document.getElementById('user-display-email').innerText = user.email;

                // Buscar Rol
                const docRef = doc(db, "usuarios", user.email);
                const docSnap = await getDoc(docRef);
                
                let userRole = "empleado"; 
                if (docSnap.exists()) {
                    userRole = docSnap.data().rol;
                }
                document.getElementById('user-display-role').innerText = userRole;

                if (userRole === 'propietario' || userRole === 'contralor') {
                    adminView.classList.remove('hidden');
                    employeeView.classList.remove('hidden'); 
                } else {
                    employeeView.classList.remove('hidden'); 
                }
            } else {
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                appScreen.classList.remove('flex');
                adminView.classList.add('hidden');
                employeeView.classList.add('hidden');
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    errorMsg.innerText = "Error: " + error.code;
                    errorMsg.classList.remove('hidden');
                });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Recuperar Contraseña
        document.getElementById('forgot-password').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            if(!email) {
                alert("Por favor, escribe tu correo arriba primero.");
                return;
            }
            sendPasswordResetEmail(auth, email)
                .then(() => alert("¡Enlace enviado! Revisa tu correo."))
                .catch((error) => alert("Error: " + error.message));
        });

        // --- FASE 2: GUARDAR REPORTE DE HORAS EN FIRESTORE ---
        tsForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            // 1. Recolectar los datos de los cuadritos
            const fecha = document.getElementById('ts-date').value;
            const proyecto = document.getElementById('ts-project').value;
            const horasReg = document.getElementById('ts-reg-hours').value;
            const horasExt = document.getElementById('ts-ext-hours').value || 0; // Si está vacío, asume 0
            const notas = document.getElementById('ts-notes').value;

            try {
                // 2. Enviar a la colección "timesheets" en Firestore
                await addDoc(collection(db, "timesheets"), {
                    empleado_email: auth.currentUser.email, // Guarda automáticamente el correo del usuario logueado
                    fecha: fecha,
                    proyecto: proyecto,
                    horas_regulares: Number(horasReg),
                    horas_extras: Number(horasExt),
                    notas: notas,
                    fecha_creacion: serverTimestamp() // Hora exacta del servidor
                });

                // 3. Mostrar éxito y limpiar formulario
                tsSuccessMsg.classList.remove('hidden');
                tsForm.reset();
                document.getElementById('ts-date').valueAsDate = new Date(); // Volver a poner la fecha de hoy
                
                // Ocultar el mensaje verde después de 3 segundos
                setTimeout(() => {
                    tsSuccessMsg.classList.add('hidden');
                }, 3000);

            } catch (error) {
                console.error("Error al guardar reporte: ", error);
                alert("Hubo un error al guardar el reporte. Revisa tu conexión a internet.");
            }
        });

    </script>
</body>
</html>
